name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    # Calidad (~12 min) + E2E completos (~17 min en local, más lentos en el runner).
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: joyeria
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: joyeria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U joyeria -d joyeria_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://joyeria:ci_password@localhost:5432/joyeria_test?schema=public
      TEST_DATABASE_URL: postgresql://joyeria:ci_password@localhost:5432/joyeria_test?schema=public
      AUTH_SECRET: ci-secret-solo-para-pruebas-con-mas-de-32-caracteres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migraciones aplican desde cero
        run: npm run db:deploy

      - name: Tests (unitarios + integración + frontend)
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar Chromium para E2E
        run: npx playwright install --with-deps chromium

      - name: E2E con PostgreSQL efímero y servidores exclusivos
        run: npm run qa:e2e

  docker:
    name: Imagen Docker de producción
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: joyeria-sole:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Despliegue: PENDIENTE hasta elegir proveedor y crear las cuentas (ver docs/deployment/DEPLOYMENT.md).
  # Con Render, el despliegue se dispara solo al hacer merge a `main` (auto-deploy),
  # o con un deploy hook:  curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
