# Entorno de DESARROLLO local.
# Solo levanta PostgreSQL: la API y el frontend corren en el host con `npm run dev`
# (recarga en caliente y depuración más simples que dentro de contenedores).
#
# Para probar la imagen de producción localmente:
#   docker compose --profile prod up --build
name: joyeria-sole

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joyeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-joyeria_dev}
      TZ: UTC
    ports:
      # Solo localhost: la base de desarrollo no debe quedar expuesta en la red local.
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - db-data:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Imagen de producción (API + frontend compilado). No se usa en el día a día.
  app:
    profiles: ['prod']
    # Vuelve solo al reiniciar la PC o Docker (la PC de la tienda no debe depender de `local:up`).
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      # D3: con APP_DB_USER/APP_DB_PASSWORD (los crea `npm run local:up`) la aplicación usa un usuario sin
      # superusuario y sin TRUNCATE; sin ellos (desarrollo), el superusuario POSTGRES_USER como antes.
      DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER:-joyeria}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB:-joyeria_dev}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      FRONTEND_URL: http://localhost:${APP_PORT:-8080}
      # Solo para prueba local sin HTTPS. En producción real debe quedar en su valor por defecto (true).
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'

volumes:
  db-data:
